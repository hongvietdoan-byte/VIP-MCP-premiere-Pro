<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e21; color: #e4e4e8; font-family: -apple-system, sans-serif;
    font-size: 11px; padding: 12px; min-height: 80px; }
  h3 { font-size: 12px; color: #fff; margin-bottom: 8px; }
  #status { color: #666; font-size: 10px; line-height: 1.6; }
  #mcpStatus { display: inline-block; margin-left: 4px; font-size: 10px; }

  #micCheck { margin-top: 12px; padding-top: 10px; border-top: 1px solid #333; }
  #micCheck h4 { font-size: 11px; color: #fff; margin-bottom: 6px; }
  .mc-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .mc-row label { width: 90px; flex-shrink: 0; color: #999; }
  .mc-row .mc-val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #ccc; font-size: 10px; }
  .mc-row button, #micCheckActions button { background: #333; color: #e4e4e8; border: 1px solid #555;
    border-radius: 3px; padding: 3px 8px; font-size: 10px; cursor: pointer; }
  .mc-row button:hover, #micCheckActions button:hover { background: #444; }
  #micCheckActions { display: flex; gap: 6px; margin-top: 8px; }
  #micCheckActions button.primary { background: #2d6cdf; border-color: #2d6cdf; }
  #micCheckActions button.primary:hover { background: #3a7bf0; }
  #micCheckActions button:disabled { opacity: 0.5; cursor: default; }
  #mcSequenceName, #mcOrientation, .mc-row select { background: #2a2a2d; color: #e4e4e8;
    border: 1px solid #555; border-radius: 3px; padding: 3px 6px; font-size: 10px; flex: 1; }
  #mcLog { margin-top: 8px; max-height: 140px; overflow-y: auto; background: #141416;
    border-radius: 3px; padding: 6px; font-size: 10px; line-height: 1.5; white-space: pre-wrap; }
  #mcDetected { background: #232326; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px;
    font-size: 10px; color: #aaa; }
  #mcDetected .mc-detected-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  #mcDetected .mc-detected-row:last-child { margin-bottom: 0; }
  #mcDetected .mc-detected-icon { width: 14px; flex-shrink: 0; text-align: center; }
  #mcDetected .mc-ok { color: #6cd67a; }
  #mcDetected .mc-warn { color: #e0b846; }
  #mcDetected .mc-err { color: #e06060; }
</style>
</head>
<body>
  <h3>Premiere MCP v2 (standalone) <span id="mcpStatus">⚫</span></h3>
  <div id="status">Đang kết nối MCP server tại port 3005…</div>

  <div id="micCheck">
    <h4>Mic Check</h4>
    <div class="mc-row">
      <label>Thư mục dự án</label>
      <span class="mc-val" id="mcFolderPath">(chưa chọn)</span>
      <button id="mcPickFolder">Chọn</button>
    </div>
    <div id="mcDetected" class="mc-detected"></div>
    <div class="mc-row">
      <label>Tên sequence</label>
      <input type="text" id="mcSequenceName" placeholder="vd: FFWS Week2">
    </div>
    <div class="mc-row">
      <label>Hướng khung hình</label>
      <select id="mcOrientation">
        <option value="landscape">Landscape 1920x1080</option>
        <option value="portrait">Portrait 1080x1920</option>
      </select>
    </div>
    <div id="micCheckActions">
      <button id="mcRunBtn" class="primary" disabled>▶ Chạy Mic Check</button>
      <button id="mcVerifyBtn" disabled>✓ Verify</button>
    </div>
    <div id="mcLog"></div>
  </div>

<script src="premiereActions.js"></script>
<script src="mcpBridge.js"></script>
<script src="micCheckPanel.js"></script>
</body>
</html>
